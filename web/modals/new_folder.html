  <!-- ========================================== -->
  <!-- MODAL: CREATE NEW ENTITY FOLDER            -->
  <!-- ========================================== -->
  <div class="modal-backdrop" id="newFolderModal" style="display: none;">
    <div class="modal-dialog modal-sm">
      <div class="modal-header">
        <h3>Create New Entity Folder</h3>
        <button class="btn-close" id="closeNewFolderBtn">&times;</button>
      </div>
      <div class="modal-body settings-body">
        <div class="form-group">
          <label for="newFolderNameInput">Entity / Company Name</label>
          <input type="text" id="newFolderNameInput" class="form-input" placeholder="e.g. Annual Reports, Contracts, Research Papers">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="confirmCreateFolderBtn">Create Entity</button>
      </div>
    </div>
  </div>
