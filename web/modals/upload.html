  <!-- ========================================== -->
  <!-- MODAL: DEDICATED ACCESSIBLE UPLOAD MODAL   -->
  <!-- ========================================== -->
  <div class="modal-backdrop" id="uploadModal" style="display: none;">
    <div class="modal-dialog modal-md">
      <div class="modal-header">
        <div class="modal-title-group">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <h3>Upload PDF Filings</h3>
        </div>
        <button class="btn-close" id="closeUploadModalBtn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group mb-3">
          <label for="uploadTargetFolderSelect">Destination Corporate Entity / Folder</label>
          <select id="uploadTargetFolderSelect" class="form-select form-select-md"></select>
        </div>

        <div class="dropzone-large" id="dropZone">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <h4>Drag and drop PDF filings here</h4>
          <p class="text-muted text-sm mt-1">or <strong style="color: var(--primary-color);">browse files from your computer</strong></p>
          <input type="file" id="fileInput" accept=".pdf" multiple style="display: none;">
        </div>
      </div>
    </div>
  </div>
