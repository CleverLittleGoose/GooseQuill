<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GooseQuill | Gemini OCR & Document Intelligence</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.ico">
  <link rel="stylesheet" href="/style.css">
  <script src="/vendor/purify.min.js"></script>
  <script src="/vendor/marked.min.js"></script>
</head>
<body>
  <div class="app-layout">
    <!-- Top Navigation Header -->
    <header class="top-nav">
      <div class="nav-left">
        <div class="brand">
          <div class="brand-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
          </div>
          <div class="brand-text">
            <h1 class="brand-title">GooseQuill</h1>
          </div>
        </div>

        <!-- Studio Navigation Switcher -->
        <nav class="studio-nav" aria-label="Main Studio Navigation">
          <button class="studio-tab-btn active" id="tabNavWorkspace" data-view="workspace">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            </svg>
            <span>Workspace</span>
          </button>
          <button class="studio-tab-btn" id="tabNavStudio" data-view="studio">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
            </svg>
            <span id="tabNavStudioDocName">Studio</span>
            <span class="tab-badge active-tag" id="topNavStudioDocBadge" style="display: none;">Active</span>
          </button>
          <button class="studio-tab-btn" id="tabNavSearch" data-view="search">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <span>Find</span>
          </button>
          <button class="studio-tab-btn" id="tabNavCombiner" data-view="combiner">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
              <line x1="8" y1="12" x2="16" y2="12"></line>
              <line x1="12" y1="8" x2="12" y2="16"></line>
            </svg>
            <span>Combine</span>
            <span class="tab-badge" id="topNavConvertedBadge" style="display: none;">0</span>
          </button>
          <button class="studio-tab-btn" id="tabNavBatches" data-view="batches">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <span>Batches</span>
            <span class="tab-badge night" id="topNavBatchActiveBadge" style="display: none;">0</span>
          </button>
          <button class="studio-tab-btn" id="tabNavEconomics" data-view="economics">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="1" x2="12" y2="23"></line>
              <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
            </svg>
            <span>Costs</span>
          </button>
        </nav>
      </div>

      <div class="nav-right">
        <!-- Interactive API status indicator -->
        <button class="status-pill active" id="apiStatusPill" title="Click to test API connection & view details">
          <span class="pulse-dot" id="statusDot"></span>
          <span id="apiStatusText">gemini-3.1-flash-lite</span>
        </button>

        <button class="btn btn-primary btn-upload-top" id="openUploadModalBtn" title="Upload new PDF files into a folder">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <span>Upload PDF</span>
        </button>

        <div class="nav-divider"></div>

        <button class="btn btn-secondary btn-icon-only" id="toggleNotificationsBtn" title="Alerts & Sound Chimes">
          <svg id="bellIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
        </button>

        <button class="btn btn-secondary btn-icon-only" id="openLogsBtn" title="Diagnostics & Logs">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="4 17 10 11 4 5"></polyline>
            <line x1="12" y1="19" x2="20" y2="19"></line>
          </svg>
          <span class="error-badge-count" id="errorCountBadge" style="display: none;">0</span>
        </button>

        <button class="btn btn-secondary btn-icon-only" id="openSettingsBtn" title="OCR Presets & Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Toast Notifications Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Global API Error / Warning Alert Banner -->
    <div class="api-alert-banner" id="apiAlertBanner" style="display: none;">
      <div class="alert-content">
        <div class="alert-icon-title">
          <svg class="alert-svg-icon" id="alertIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <div>
            <strong id="alertTitle">API Warning</strong>
            <span class="alert-msg" id="alertMessage">Details here...</span>
          </div>
        </div>
        <div class="alert-actions">
          <button class="btn btn-sm btn-secondary" id="alertViewLogsBtn">View Diagnostics</button>
          <button class="btn-close-alert" id="dismissAlertBtn">&times;</button>
        </div>
      </div>
    </div>

    <!-- Global Progress Banner (shown when converting) -->
    <div class="progress-banner" id="progressBanner" style="display: none;">
      <div class="banner-content">
        <div class="banner-info">
          <span class="spinner"></span>
          <div>
            <strong id="bannerDocName">Processing Document...</strong>
            <span class="banner-sub" id="bannerPageInfo">Page 0 of 0 (0%)</span>
          </div>
        </div>
        <div class="banner-actions">
          <span id="rateLimitWarningPill" class="warning-pill" style="display: none;">Rate Limit Retry Active</span>
          <button class="btn btn-sm btn-danger" id="cancelJobBtn">Cancel Job</button>
        </div>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressBarFill" style="width: 0%;"></div>
      </div>
    </div>

    <!-- Main Views Container -->
    <main class="main-body">
      <!--#include file="views/workspace.html" -->

      <!--#include file="views/search.html" -->

      <!--#include file="views/combiner.html" -->

      <!--#include file="views/batches.html" -->

      <!--#include file="views/economics.html" -->

      <!--#include file="views/studio.html" -->
    </main>
  </div>

  <!--#include file="modals/upload.html" -->

  <!--#include file="modals/settings.html" -->

  <!--#include file="modals/logs.html" -->

  <!--#include file="modals/new_folder.html" -->

  <script type="module" src="/app.js"></script>
</body>
</html>
